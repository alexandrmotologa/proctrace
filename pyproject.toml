[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proctrace"
version = "0.1.0"
description = "Cross-platform process activity and syscall waterfall monitor with native kernel tracing, lock-free ring buffer, and DevTools timeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Alexandr Motologa", email = "alexandr@mtlg.site" }
]
keywords = [
    "system-monitoring",
    "process-monitor",
    "syscall-tracer",
    "etw",
    "ptrace",
    "dtrace",
    "chrome-tracing",
    "ring-buffer",
    "waterfall-timeline",
    "fastapi",
    "textual-tui",
    "devtools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Debuggers"
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "websockets>=11.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "ruff>=0.3.0"
]

[project.scripts]
proctrace = "proctrace.cli.main:app"

[project.urls]
Homepage = "https://github.com/alexandrmotologa/proctrace"
Repository = "https://github.com/alexandrmotologa/proctrace"
Issues = "https://github.com/alexandrmotologa/proctrace/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
